services:
  app:
    build: .
    command: uvicorn asgi:app --host 0.0.0.0 --port 8000
    volumes:
      - ./:/app
    ports:
      - "8000:8000"

  streamlit:
    build: .
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    volumes:
      - ./:/app
    depends_on:
      - app
    ports:
      - "8501:8501"
