version: '3.8'

services:
  backend:
    build: .
    command: uvicorn asgi:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - postgres
    ports:
      - "8000:8000"

  streamlit:
    build: .
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - .:/app
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000/api/inference/video
    depends_on:
      - backend
    ports:
      - "8501:8501"

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  grafana_data:
